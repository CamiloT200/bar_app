{% load static %}<!doctype html>
<html lang="es-CO" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Bar{% endblock %} · Bar</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{% url 'ventas:tablero' %}"><i class="bi bi-cup-straw"></i> Bar</a>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link {% block nav_ventas %}{% endblock %}" href="{% url 'ventas:tablero' %}"><i class="bi bi-receipt"></i> Ventas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_inventario %}{% endblock %}" href="{% url 'inventario:productos' %}"><i class="bi bi-box-seam"></i> Inventario</a>
        </li>
        <li class="nav-item"><span class="nav-link disabled" aria-disabled="true"><i class="bi bi-cash-stack"></i> Finanzas</span></li>
      </ul>
    </div>
  </nav>

  <main class="container-fluid pb-4">
    {% block mensajes %}
      {% for mensaje in messages %}
        <div class="alert alert-{{ mensaje.tags }} fs-5 py-2" role="alert">{{ mensaje }}</div>
      {% endfor %}
    {% endblock %}
    {% block contenido %}{% endblock %}
  </main>

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'js/busqueda.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
