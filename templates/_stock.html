{% load stock %}{% with nivel=producto|nivel_stock cantidad=producto|stock_actual %}{% if nivel == "sin" %}<span class="badge text-bg-danger stock" title="Sin stock">{{ cantidad }}</span>{% elif nivel == "bajo" %}<span class="badge text-bg-warning stock" title="Stock bajo">{{ cantidad }}</span>{% else %}<span class="badge text-bg-secondary stock">{{ cantidad }}</span>{% endif %}{% endwith %}
