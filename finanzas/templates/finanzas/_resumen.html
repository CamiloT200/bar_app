{% load formato %}
{# Las cuatro cifras de una jornada. Uso: include with ve=… vo=… ce=… ge=… #}
<div class="row g-2 mb-3">
  <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
    <div class="text-body-secondary">Ventas en efectivo</div><div class="fs-3 fw-bold">{{ ve|pesos }}</div>
  </div></div></div>
  <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
    <div class="text-body-secondary">Otros medios <span class="fs-6">(no están en el cajón)</span></div><div class="fs-3 fw-bold">{{ vo|pesos }}</div>
  </div></div></div>
  <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
    <div class="text-body-secondary">Compras con caja</div><div class="fs-3 fw-bold">{% if ce %}− {% endif %}{{ ce|pesos }}</div>
  </div></div></div>
  <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
    <div class="text-body-secondary">Gastos con caja</div><div class="fs-3 fw-bold">{% if ge %}− {% endif %}{{ ge|pesos }}</div>
  </div></div></div>
</div>
